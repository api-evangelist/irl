aid: irl
name: IRL
description: >-
  IRL (legal name Get Together, Inc.) was a San Francisco social calendar and group-messaging
  app that let people share and sync calendars with friends and follow venues, organizations
  and notable figures. It raised more than $200 million in venture capital, including a $170
  million Series C led by SoftBank Vision Fund 2 in 2021 that valued the company at $1.17
  billion. In June 2023 a special committee of the board reported that roughly 95 percent of
  the app's claimed users were automated or bot accounts, and the board voted to dissolve the
  company; the SEC charged founder and former CEO Abraham Shafi with fraud on July 31, 2024.
  The company is defunct: irl.com now serves only an asset-inquiry notice, the marketing and
  app hosts are abandoned Netlify shells, docs.irl.com (Postman-hosted developer docs) returns
  404, and api.irl.com is a dangling CNAME to a deleted AWS Elastic Beanstalk environment.
  No public API, OpenAPI, SDK, or developer program remains.
